<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Oneindige Foto Slider</title>
    <style>
        body {
            margin: 0;
            overflow-x: hidden; /* Voorkom horizontaal scrollen van de pagina zelf */
            background-color: transparent;
        }

        .slider-container {
            width: 100%;
            overflow: hidden;
            background: transparent;
            padding: 30px 0;
            display: flex;
        }

        .slider-track {
            display: flex;
            width: max-content; /* Past zich automatisch aan de breedte van alle foto's aan */
            /* SNELHEID: 80s voor een heel rustig effect. Lager = sneller */
            animation: schuif-links 80s linear infinite;
        }

        .slider-track img {
            height: 300px; /* Iets minder hoog zoals gevraagd */
            width: auto;   /* Breedte past zich aan om verhoudingen te bewaren */
            margin: 0 15px;
            border-radius: 10px;
            flex-shrink: 0;
            /* Subtiele schaduw voor diepte */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* De animatie: schuift van rechts naar links */
        @keyframes schuif-links {
            0% {
                transform: translateX(0);
            }
            100% {
                /* Verschuif exact de helft (één volledige set van 10 foto's) */
                transform: translateX(-50%);
            }
        }

        /* Pauzeer bij hover */
        .slider-container:hover .slider-track {
            animation-play-state: paused;
        }
    </style>
</head>
<body>

    <div class="slider-container">
        <div class="slider-track">
            <img src="foto1.jpg" alt="1">
            <img src="foto2.jpg" alt="2">
            <img src="foto3.jpg" alt="3">
            <img src="foto4.jpg" alt="4">
            <img src="foto5.jpg" alt="5">
            <img src="foto6.jpg" alt="6">
            <img src="foto7.jpg" alt="7">
            <img src="foto8.jpg" alt="8">
            <img src="foto9.jpg" alt="9">
            <img src="foto10.jpg" alt="10">

            <img src="foto1.jpg" alt="1">
            <img src="foto2.jpg" alt="2">
            <img src="foto3.jpg" alt="3">
            <img src="foto4.jpg" alt="4">
            <img src="foto5.jpg" alt="5">
            <img src="foto6.jpg" alt="6">
            <img src="foto7.jpg" alt="7">
            <img src="foto8.jpg" alt="8">
            <img src="foto9.jpg" alt="9">
            <img src="foto10.jpg" alt="10">
        </div>
    </div>

</body>
</html>
