<!DOCTYPE html>
<html lang="nl">
<head>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        
        .slideshow-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .slideshow-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Zorgt dat de afbeelding schermvullend is zonder vervorming */
            opacity: 0;
            animation: fade 50s infinite; /* 10 beelden * 5 seconden = 50s totaal */
        }

        /* Elke afbeelding krijgt een vertraging van 5 seconden extra */
        .slideshow-container img:nth-child(1) { animation-delay: 0s; }
        .slideshow-container img:nth-child(2) { animation-delay: 5s; }
        .slideshow-container img:nth-child(3) { animation-delay: 10s; }
        .slideshow-container img:nth-child(4) { animation-delay: 15s; }
        .slideshow-container img:nth-child(5) { animation-delay: 20s; }
        .slideshow-container img:nth-child(6) { animation-delay: 25s; }
        .slideshow-container img:nth-child(7) { animation-delay: 30s; }
        .slideshow-container img:nth-child(8) { animation-delay: 35s; }
        .slideshow-container img:nth-child(9) { animation-delay: 40s; }
        .slideshow-container img:nth-child(10) { animation-delay: 45s; }

        @keyframes fade {
            0% { opacity: 0; }
            5% { opacity: 1; }  /* Fade-in */
            10% { opacity: 1; } /* Blijft staan */
            15% { opacity: 0; } /* Fade-out */
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="slideshow-container">
        <img src="foto1.jpg" alt="Slide 1">
        <img src="foto2.jpg" alt="Slide 2">
        <img src="foto3.jpg" alt="Slide 3">
        <img src="foto4.jpg" alt="Slide 4">
        <img src="foto5.jpg" alt="Slide 5">
        <img src="foto6.jpg" alt="Slide 6">
        <img src="foto7.jpg" alt="Slide 7">
        <img src="foto8.jpg" alt="Slide 8">
        <img src="foto9.jpg" alt="Slide 9">
        <img src="foto10.jpg" alt="Slide 10">
    </div>

</body>
</html>
