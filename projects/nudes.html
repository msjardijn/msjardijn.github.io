<title>Beeldcarrousel · AI en het Genie</title>
<style>
:root {
--primary-blue: #00d4ff;
--primary-gold: #ffcc00;
--bg-dark: #0a0a0a;
--scroll-speed: 40s; /* Pas hier de snelheid aan */
}

body {
background-color: var(--bg-dark);
color: #ffffff;
font-family: 'Segoe UI', Roboto, sans-serif;
margin: 0;
overflow-x: hidden;
display: flex;
flex-direction: column;
justify-content: center;
min-height: 100vh;
}

h1 {
text-align: center;
color: var(--primary-blue);
text-transform: uppercase;
letter-spacing: 4px;
font-size: 1.5rem;
margin-bottom: 50px;
text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
}

/* Container voor de marquee */
.marquee-container {
width: 100%;
overflow: hidden;
background: rgba(255, 255, 255, 0.03);
border-top: 1px solid rgba(255, 255, 255, 0.1);
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
padding: 40px 0;
backdrop-filter: blur(5px);
}

.marquee-content {
display: flex;
width: calc(300px * 40); /* Gebaseerd op 20 afbeeldingen + 20 kopieën voor naadloze loop */
animation: scroll var(--scroll-speed) linear infinite;
}

/* Pauze bij mouse-over */
.marquee-container:hover .marquee-content {
animation-play-state: paused;
}

.marquee-content img {
width: 300px;
height: 400px;
object-fit: cover;
margin: 0 15px;
border-radius: 8px;
border: 1px solid rgba(255, 255, 255, 0.2);
filter: grayscale(60%) brightness(70%);
transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
cursor: pointer;
}

/* Oplichten bij mouse-over */
.marquee-content img:hover {
filter: grayscale(0%) brightness(110%);
border-color: var(--primary-gold);
transform: scale(1.05);
box-shadow: 0 0 30px rgba(255, 204, 0, 0.4);
z-index: 10;
}

/* De Animatie */
@keyframes scroll {
0% { transform: translateX(0); }
100% { transform: translateX(calc(-330px * 20)); } /* Breedte afbeelding + margin * aantal */
}

footer {
text-align: center;
margin-top: 50px;
color: var(--primary-gold);
font-size: 0.9rem;
opacity: 0.7;
}
</style>
</head>
