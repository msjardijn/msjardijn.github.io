<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vlees en Algoritme - Coming Soon</title>
    <style>
        :root {
            --vlees-rood: #5e0b0b;
            --algoritme-wit: #f4f4f4;
            --diep-zwart: #0a0a0a;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Times New Roman', Times, serif; /* Een knipoog naar de klassieke traditie */
            background-color: var(--diep-zwart);
            color: var(--algoritme-wit);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 2;
            padding: 20px;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.5rem;
            margin: 0;
            line-height: 1.1;
        }

        h1 span {
            color: var(--vlees-rood);
            display: block;
            font-style: italic;
        }

        .subtitle {
            margin-top: 2rem;
            font-size: 1.2rem;
            letter-spacing: 0.2rem;
            opacity: 0.7;
            text-transform: lowercase;
        }

        /* Het "Algoritme" op de achtergrond */
        .background-code {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-family: monospace;
            font-size: 10px;
            color: var(--vlees-rood);
            opacity: 0.15;
            pointer-events: none;
            white-space: pre-wrap;
            overflow: hidden;
            line-height: 1.2;
        }

        .cta {
            margin-top: 4rem;
            border-bottom: 1px solid var(--vlees-rood);
            display: inline-block;
            padding-bottom: 5px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        .cta:hover {
            color: var(--vlees-rood);
            border-bottom-color: var(--algoritme-wit);
        }
    </style>
</head>
<body>

    <div class="background-code" id="code-bg"></div>

    <div class="container">
        <h1>Vlees <span>en Algoritme</span></h1>
        <p class="subtitle">Een onderzoek naar de menselijke maat in de machine.</p>
        <a href="#" class="cta">Binnenkort beschikbaar</a>
    </div>

    <script>
        // Een simpel algoritme om de achtergrond te vullen met "vlees" en code
        const bg = document.getElementById('code-bg');
        let codeStr = "01100110 01101100 01100101 01110011 01101000 "; // "flesh" in binary
        for(let i=0; i<5000; i++) {
            codeStr += (Math.random() > 0.5 ? "vlees " : "algoritme ");
        }
        bg.innerText = codeStr;
    </script>
</body>
</html>
