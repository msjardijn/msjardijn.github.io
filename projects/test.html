<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI en het Genie · Test Pagina</title>
    <style>
        /* ----- Basis instellingen ----- */
        :root {
            --primary-blue: #00d4ff;
            --primary-gold: #ffcc00;
            --bg-dark: #0a0a0a;
            --card-bg: rgba(22, 22, 22, 0.85); /* Transparantie voor diepte */
            --text-gray: #b0b0b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark); /* Fallback */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ----- ACHTERGROND FOTO MET ZOOM EFFECT ----- */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Zorgt dat het achter de tekst staat */
            overflow: hidden;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            /* Pad is foto1.jpg omdat deze in dezelfde map 'projects' staat */
            background-image: linear-gradient(rgba(10, 10, 10, 0.7), rgba(10, 10, 10, 0.85)), url('foto1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            animation: subtleZoom 30s infinite alternate ease-in-out;
        }

        @keyframes subtleZoom {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* ----- Content Styling ----- */
        header {
            background: linear-gradient(180deg, rgba(17,17,17,0.9) 0%, rgba(10,10,10,0) 100%);
            padding: 80px 20px 60px 20px;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1; /* Zorgt dat content bovenop de bg-container ligt */
        }

        .section-title {
            border-left: 4px solid var(--primary-blue);
            padding-left: 15px;
            margin: 40px 0 20px 0;
            font-size: 1.8em;
            color: var(--primary-blue);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card, .dashboard-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); /* Modern 'glass' effect */
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-blue);
        }

        .project-text {
            background: rgba(10, 10, 10, 0.9);
            padding: 40px;
            border-radius: 12px;
            margin-top: 30px;
            border: 1px solid #333;
        }

        footer {
            text-align: center;
            padding: 60px;
            color: #666;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
