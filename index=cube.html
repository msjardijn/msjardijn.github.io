<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <title>Martin Sjardijn | Cube Test</title>
    <style>
        body {
            margin: 0;
            background: #111 url('https://msjardijn.github.io/sculptures/fonds2g.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* De container die de 3D ruimte definieert */
        .stage {
            width: 200px;
            height: 200px;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-left: -100px;
            margin-top: -100px;
            perspective: 800px;
            z-index: 999; /* Zorg dat hij overal bovenop staat */
        }
/* 2. Het Menu (zonder achtergrondkleur/band) */
    nav {
        position: relative;
        z-index: 0;
        padding: 0px;
        text-align: center;
        background: none; /* Verwijdert de zwarte band */
 }

        /* De kubus zelf */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 15s infinite linear;
        }

        /* Elke zijde van de kubus */
        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8); /* Zwart met lichte glans */
            border: 2px solid gold; /* Goudkleur valt beter op dan wit */
            line-height: 200px;
            text-align: center;
            color: gold;
            font-weight: bold;
            box-sizing: border-box;
        }

        /* Positionering met de juiste 3D transformaties */
        .front  { transform: translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY(90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX(90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes rotate {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to   { transform: rotateX(360deg) rotateY(360deg); }
        }

        /* Menu bovenop */
        nav {
            position: relative;
            z-index: 1000;
            background: rgba(0,0,0,0.6);
            padding: 20px;
            text-align: center;
        }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
    </style>
  </head>
  <body>

            <td><a href="links/links.html"><strong>LINKS</strong></a></td>
          </tr>
        </tbody>
      </table>
    </nav>
    <div class="stage">
      <div class="cube">
        <div class="face front">MS</div>
        <div class="face back">MS</div>
        <div class="face right">MS</div>
        <div class="face left">MS</div>
        <div class="face top">MS</div>
        <div class="face bottom">MS</div>
      </div>
