<!DOCTYPE html>
<html lang="nl">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Martin Sjardijn | Beeldend Kunstenaar & Schrijver</title>
    <meta name="description" content="Officiële website van Martin Sjardijn.">
    <meta name="author" content="Martin Sjardijn">
    
    <style>
        /* GLOBALE RESET & BASIS */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111 url('https://msjardijn.github.io/sculptures/fonds2g.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* TYPO & KOP */
        header h1 { 
            margin-left: 20px; 
            font-size: 2rem;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        /* ————— NAVIGATIE ————— */
        nav {
            position: relative;
            z-index: 1000;
            padding: 20px;
            text-align: center;
            background: none;
        }
        nav table {
            margin: 0 auto;
            border-collapse: collapse;
        }
        nav td { 
            padding: 0 10px; 
        }
        nav a { 
            color: white; 
            text-decoration: none; 
            font-weight: bold;
            font-size: 1.1rem;
            transition: color 0.2s, border-bottom 0.2s;
            padding-bottom: 4px;
            border-bottom: 1px solid transparent;
        }
        nav a:hover {
            color: gold;
            border-bottom-color: gold;
        }

        /* ————— 3D KUBUS ————— */
        .stage {
            width: 200px;
            height: 200px;
            position: absolute;
            top: 55%;
            left: 50%;
            margin-left: -100px;
            margin-top: -100px;
            perspective: 800px;
            z-index: 999;
        }

        /* KLIKBARE OVERLAY — onzichtbaar, vangt klikken */
        .cube-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            z-index: 1001;               /* Boven de kubus */
            cursor: pointer;
            pointer-events: auto;         /* Actief voor klik */
            background: transparent;       /* Volledig doorzichtig */
            border-radius: 4px;
        }

        /* KUBUS ZELF: GEEN MUISGEBEURTENISSEN (klik gaat door naar overlay) */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* standaard animatie (draaien) */
            animation: rotate 20s infinite linear;
            /* geen directe muisgebeurtenissen op kubus, hover gebeurt op .stage */
            pointer-events: none;          
        }

        /* ZODRA DE MUIS OVER DE .stage (het hele kubusgebied) gaat, stoppen we de animatie */
        .stage:hover .cube {
            animation-play-state: paused;
        }

        /* VLAKKEN met goudkleurige rand */
        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: #222; /* Donkere achtergrond voor als afbeelding niet laadt */
            border: 1px solid gold;
            box-sizing: border-box;
            overflow: hidden;
            box-shadow: 0 0 8px rgba(255,215,0,0.3);
            backface-visibility: visible;
        }

        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            /* Zwart-wit filtering voor een artistiek effect */
            filter: grayscale(80%) contrast(1.1);
            transition: filter 0.3s;
        }
        
        /* Subtiel effect als de kubus stilstaat */
        .stage:hover .face img {
            filter: grayscale(40%) contrast(1.2); 
        }

        /* 3D posities – correct */
        .front  { transform: translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY(90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX(90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes rotate {
            0%   { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        /* ————— LOGO ONDER ————— */
        .logo-bottom {
            position: absolute;
            bottom: 20px;
            left: 20px;
            opacity: 0.9;
            transition: opacity 0.2s;
        }
        .logo-bottom img {
            display: block;
            width: 76px;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .logo-bottom:hover {
            opacity: 1;
        }

        a, button {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- HOOFDTITEL -->
    <header>
        <h1>MARTIN SJARDIJN</h1>
    </header>

    <!-- NAVIGATIEBALK -->
    <nav>
        <table cellspacing="2" cellpadding="2" border="0" align="center">
            <tbody>
                <tr>
                    <td><a href="about/about.html">ABOUT</a></td>
                    <td><a href="paintings/paintings.html">PAINTINGS</a></td>
                    <td><a href="drawings/drawings.html">DRAWINGS</a></td>
                    <td><a href="sculptures/sculptures.html">SCULPTURES</a></td>
                    <td><a href="books/books.html">BOOKS</a></td>
                    <td><a href="writings/writings.html">WRITINGS</a></td>
                    <td><a href="projects/projects.html">PROJECTS</a></td>
                    <td><a href="links/links.html">LINKS</a></td>
                </tr>
            </tbody>
        </table>
    </nav>

    <!-- KUBUS MET OVERLAY-LINK & HOVER STOP -->
    <div class="stage">
        <!-- KLIKBARE OVERLAY (onzichtbare link) -->
        <a href="https://msjardijn.github.io/projects/info/info.html" 
           class="cube-link" 
           target="_blank" 
           rel="noopener noreferrer"
           aria-label="Meer informatie over projecten (opent in nieuwe tab)">
        </a>

        <!-- ROTERENDE 3D KUBUS met ECHTE AFBEELDINGEN -->
        <div class="cube">
            <div class="face front">
                <img src="foto1.jpg" alt="Voorzijde kubus - Martin Sjardijn kunstwerk">
            </div>
            <div class="face back">
                <img src="de.jpg" alt="Achterzijde kubus - Martin Sjardijn kunstwerk">
            </div>
            <div class="face right">
                <img src="foto1.jpg" alt="Rechterzijde kubus - Martin Sjardijn kunstwerk">
            </div>
            <div class="face left">
                <img src="de.jpg" alt="Linkerzijde kubus - Martin Sjardijn kunstwerk">
            </div>
            <div class="face top">
                <img src="foto1.jpg" alt="Bovenzijde kubus - Martin Sjardijn kunstwerk">
            </div>
            <div class="face bottom">
                <img src="foto1.jpg" alt="Onderzijde kubus - Martin Sjardijn kunstwerk">
            </div>
        </div>
    </div>

    <!-- VASTE LOGO ONDERLINKS -->
    <div class="logo-bottom">
        <img src="stroom-logo.jpg" alt="Stroom logo" width="76" height="38">
    </div>

    <!-- 
        OPGELOST: De afbeeldingen zijn nu correct gelinkt met "foto1.jpg" zoals in het origineel.
        Bij hover stopt de kubus met draaien en worden de afbeeldingen iets helderer.
        De klikbare link werkt nog steeds.
    -->
</body>
