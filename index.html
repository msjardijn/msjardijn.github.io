<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Martin Sjardijn | Beeldend Kunstenaar &amp; Schrijver</title>
    <meta name="description" content="Officiële website van Martin Sjardijn.">
    <meta name="author" content="Martin Sjardijn">
    
    <style>
        body {
            margin: 0;
            background: #111 url('https://msjardijn.github.io/sculptures/fonds2g.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Navigatie styling */
        nav {
            position: relative;
            z-index: 1000;
            padding: 20px;
            text-align: center;
            background: none;
        }
        nav a { 
            color: white; 
            text-decoration: none; 
            font-weight: bold; 
        }
        nav td { padding: 0 10px; }

        /* De 3D Stage */
        .stage {
            width: 200px;
            height: 200px;
            position: absolute;
            top: 55%; /* Iets lager voor betere balans met menu */
            left: 50%;
            margin-left: -100px;
            margin-top: -100px;
            perspective: 800px;
            z-index: 999;
        }

        /* De kubus zelf */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 15s infinite linear;
        }

        /* Elke zijde van de kubus */
        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid gold;
            line-height: 200px;
            text-align: center;
            color: gold;
            font-weight: bold;
            box-sizing: border-box;
            overflow: hidden; /* Zorgt dat afbeelding niet uitsteekt */
        }

        /* Specifieke styling voor de afbeelding-zijde */
        .face.front {
            padding: 0;
        }
        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Vult de zijde perfect */
            display: block;
        }
        .face a {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Positionering 3D */
        .front  { transform: translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY(90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX(90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes rotate {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to   { transform: rotateX(360deg) rotateY(360deg); }
        }

        header h1 { margin-left: 20px; }
        .logo-bottom { position: absolute; bottom: 20px; left: 20px; }
    </style>
</head>
<body>

    <header>
        <h1><font color="#ffffff">MARTIN SJARDIJN</font></h1>
    </header>

    <nav>
      <table cellspacing="2" cellpadding="2" border="0" align="center">
        <tbody>
          <tr>
            <td><a href="about/about.html">ABOUT</a></td>
            <td><a href="paintings/paintings.html">PAINTINGS</a></td>
            <td><a href="drawings/drawings.html">DRAWINGS</a></td>
            <td><a href="sculptures/sculptures.html">SCULPTURES</a></td>
            <td><a href="books/books.html">BOOKS</a></td>
            <td><a href="writings/writings.html">WRITINGS</a></td>
            <td><a href="projects/projects.html">PROJECTS</a></td>
            <td><a href="links/links.html">LINKS</a></td>
          </tr>
        </tbody>
      </table>
    </nav>

    <div class="stage">
      <div class="cube">
        <div class="face front">
          <a href="https://msjardijn.github.io/projects/info/info.html" target="_blank">
            <img src="foto1.jpg" alt="Project Info">
          </a>
        </div>
        
        <div class="face back">
           <a href="https://msjardijn.github.io/projects/info/info.html" target="_blank">
            <img src="foto1.jpg" alt="Project Info">
          </a> 
            </div>
        <div class="face right">7 maart 2026</div>
        <div class="face left">AI en het GENIE</div>
        <div class="face top">AI en het GENIE</div>
        <div class="face bottom"></div>
      </div>
    </div>

    <div class="logo-bottom">
        <img src="stroom-logo.jpg" alt="Logo" width="76" height="38">
    </div>

</body>
</html>
