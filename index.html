<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: #111 url('https://msjardijn.github.io/sculptures/fonds2g.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        nav {
            position: relative;
            z-index: 1000;
            padding: 20px;
            text-align: center;
            background: none;
        }
        nav a { 
            color: white; 
            text-decoration: none; 
            font-weight: bold; 
        }
        nav td { padding: 0 10px; }

        .stage {
            width: 200px;
            height: 200px;
            position: absolute;
            top: 55%;
            left: 50%;
            margin-left: -100px;
            margin-top: -100px;
            perspective: 800px;
            z-index: 999;
        }

        /* ✅ De klikbare overlay – ligt precies over de kubus */
        .cube-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            z-index: 1001;       /* Boven de kubus */
            cursor: pointer;
            pointer-events: auto; /* Vangt alle klikken op */
            /* (Eventueel tijdelijk een rode achtergrond om te testen) */
            /* background: rgba(255,0,0,0.2); */
        }

        /* De kubus zelf mag geen muisgebeurtenis ontvangen – die gaan naar de overlay */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 15s infinite linear;
            pointer-events: none; /* 🔥 Dit is de sleutel: klikken gaan door de kubus heen */
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: none;
            border: 1px solid gold;
            box-sizing: border-box;
            overflow: hidden;
        }

        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 3D-posities */
        .front  { transform: translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY(90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX(90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes rotate {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to   { transform: rotateX(360deg) rotateY(360deg); }
        }

        header h1 { margin-left: 20px; }
        .logo-bottom { position: absolute; bottom: 20px; left: 20px; }
    </style>
</head>
<body>

    </header>

        <!-- De kubus met afbeeldingen (niet klikbaar) -->

<div class="face front">
<div class="face front">

</div>

            </div>
            <div class="face right">

            </div>
            <div class="face left">
