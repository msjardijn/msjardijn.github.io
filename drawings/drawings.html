    <style>
        /* Achtergrond en Basis */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            background-image: url('https://msjardijn.github.io/sculptures/fonds2g.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            color: white;
        }

        .content-container {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.4);
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Navigatie */
        header h1 { margin-left: 20px; }
        header a { font-size: 0.6em; margin-left: 15px; color: #ccc; }

        nav table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        nav td { padding: 10px; text-align: center; font-weight: bold; }
        nav a { color: #ffffff; text-decoration: none; }
        nav a:hover { text-decoration: underline; }

        /* De Nieuwe Slider */
        .slider-container {
            width: 100%;
            overflow: hidden;
            background: transparent;
            padding: 60px 0;
            display: flex;
            margin-top: auto;
            margin-bottom: auto;
        }

        .slider-track {
            display: flex;
            width: max-content;
            /* Loopt langzaam van rechts naar links */
            animation: loop-links 80s linear infinite;
        }

        .slider-track img {
            height: 350px; /* Mooie hoogte voor tekeningen */
            width: auto;
            margin: 0 20px;
            border-radius: 5px; /* Iets minder rond voor tekeningen (papier-look) */
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            flex-shrink: 0;
            background-color: white; /* Geeft tekeningen een witte 'papier' rand indien nodig */
            padding: 5px;
        }

        /* Hover effect */
        .slider-track img:hover {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: 0 12px 25px rgba(0,0,0,0.7);
        }

        .slider-container:hover .slider-track {
            animation-play-state: paused;
        }

        /* Naadloze animatie van rechts naar links */
        @keyframes loop-links {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
