<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <style>
        /* Achtergrond en Basis */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Voorkomt scrollen van de hele pagina */
        }

        body {
            background-image: url('https://msjardijn.github.io/sculptures/fonds2g.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            color: white;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5); /* Iets donkerder voor betere focus op kunst */
        }

        /* Navigatie */
        header { padding: 20px 0 10px 40px; }
        header h1 { margin: 0; font-size: 1.8em; }
        header span { font-size: 0.5em; color: #ccc; margin-left: 10px; }

        nav { padding: 0 20px; }
        nav table { width: 100%; border-collapse: collapse; }
        nav td { padding: 12px 5px; text-align: center; font-weight: bold; font-size: 0.9em; }
        nav a { color: #ffffff; text-decoration: none; transition: 0.3s; }
        nav a:hover { color: #ccc; text-decoration: underline; }

        /* De Slider */
        .slider-container {
            flex-grow: 1; /* Neemt de rest van de verticale ruimte in */
            display: flex;
            align-items: center; /* Centreert de slider verticaal */
            width: 100%;
            overflow: hidden;
            background: transparent;
        }

        .slider-track {
            display: flex;
            width: max-content;
            animation: loop-links 100s linear infinite; /* Iets trager voor tekeningen */
        }

        .slider-track img {
            height: 450px; /* Hoogte verhoogd voor betere zichtbaarheid */
            width: auto;   /* Behoudt de originele verhoudingen (niet langwerpig maken) */
            margin: 0 30px;
            border-radius: 3px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: transform 0.5s ease;
            flex-shrink: 0;
            /* Geen achtergrondkleur of padding meer, dit voorkomt witte vlakken */
        }

        /* Hover effect */
        .slider-track img:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .slider-container:hover .slider-track {
            animation-play-state: paused;
        }

        /* Oneindige loop van RECHTS naar LINKS */
        @keyframes loop-links {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Mobiele optimalisatie */
        @media (max-width: 768px) {
            .slider-track img { height: 300px; }
            nav td { font-size: 0.7em; }
        }
    </style>
</head>
